<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Juana - Customers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#0f3d27; --green-700:#0f5132; --green-100:#e3f0e6; --green-50:#eef5ee;
  --cream:#f4eee0; --cream-2:#ede3d2; --card:#fffdf8; --border:#e3d9c6; --track:#dfe6dc;
  --ink:#1c2b22; --muted:#6f7a72; --amber-bg:#f6e6d3; --amber:#8a5a2b;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);background:var(--cream-2)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-700);outline-offset:2px}

.layout{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:60px;flex:none;background:var(--green-900);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0;position:sticky;top:0;height:100vh;z-index:5}
.sidebar ul{list-style:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.sb-logo{color:#d9ead9;margin-bottom:28px;display:block}
.nav-link{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#cfe0d3;transition:background .15s}
.nav-link:hover{background:rgba(255,255,255,.1)}
.nav-link.active{background:#3d6b52;color:#fff}
.nav-link svg{width:22px;height:22px}
.sb-divider{width:28px;height:1px;background:rgba(255,255,255,.2);margin:10px 0}
.sb-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#f7f2e6 0%,#efe6d4 100%)}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 32px;background:#fbf8f0;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;color:var(--green-700)}
.brand-name{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;display:block}
.brand-tag{display:block;font-size:8px;letter-spacing:.3em;margin-top:3px;text-align:center}
.gsearch{flex:0 1 320px;position:relative}
.gsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.gsearch input{width:100%;height:36px;border:1px solid var(--border);border-radius:999px;background:#fff;padding:0 16px 0 38px;font-size:11px}
.hactions{display:flex;align-items:center;gap:18px}
.bell{position:relative;background:none;border:0;cursor:pointer;width:32px;height:32px;display:grid;place-items:center}
.bell svg{width:20px;height:20px}
.bell i{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:#d13b3b}
.profile{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid var(--border)}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--green-700);color:#fff;display:grid;place-items:center}
.avatar-sm svg{width:16px;height:16px}
.profile b{display:block;font-size:11px;font-weight:600}
.profile small{font-size:10px;color:var(--muted)}

.content{padding:28px 32px 24px;flex:1;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.page-title{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--green-700);line-height:1.1}
.page-sub{font-size:11px;color:var(--muted);margin-top:6px}

/* Toolbar */
.toolbar{display:flex;gap:14px;flex-wrap:wrap}
.search{flex:1 1 320px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.search input{width:100%;height:40px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0 14px 0 38px;font-size:12px}
.search input::placeholder{color:#8b948d}
.select{position:relative;flex:0 0 150px;display:block}
.select.sort{flex-basis:146px}
.select span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:500;pointer-events:none}
.select::after{content:"";position:absolute;right:14px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select select{width:100%;height:40px;appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0 30px 0 14px;font-size:11px;font-weight:500;cursor:pointer}
.select.status select{color:transparent}
.select.status select option{color:var(--ink)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 6px rgba(60,50,30,.06)}
.card-top{display:flex;gap:12px}
.initials{width:42px;height:42px;border-radius:10px;background:var(--green-100);color:var(--green-700);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.cname{font-weight:700;font-size:14px;line-height:1.2}
.cid{font-size:10px;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;padding:3px 10px;border-radius:999px;margin-top:8px}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.active{background:var(--green-100);color:var(--green-700)}
.pill.inactive{background:var(--amber-bg);color:var(--amber)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:11px}
.meta small{display:block;font-size:9px;font-weight:600;color:#5b665e;letter-spacing:.04em;margin-bottom:3px;text-transform:uppercase}
.meta b{font-weight:600;color:var(--green-900);font-size:11px}
.meta div:last-child{flex:0 0 46%}
.stamps{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.stamps-row{display:flex;justify-content:space-between;font-size:10px;color:#5b665e}
.stamps-row b{color:var(--green-900);font-weight:700}
.bar{height:4px;background:var(--track);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-700);border-radius:4px}
.view{display:block;text-align:right;font-size:10px;font-weight:700;color:var(--green-900);margin-top:8px}
.view:hover{text-decoration:underline}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:var(--card);border:1px dashed var(--border);border-radius:14px}
.empty h3{font-family:var(--font-display);font-size:20px;color:var(--green-700)}
.empty p{font-size:12px;color:var(--muted);margin:6px 0 14px}
.btn{background:var(--green-700);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer}

/* Pagination */
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.foot p{font-size:10px;color:var(--muted)}
.pages{display:flex;align-items:center;gap:6px}
.pg{min-width:30px;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:500;cursor:pointer}
.pg:hover:not(:disabled):not(.on){background:var(--green-50)}
.pg.on{background:var(--green-700);border-color:var(--green-700);color:#fff}
.pg:disabled{opacity:.4;cursor:default}
.dots{font-size:12px;color:var(--muted);padding:0 4px}

@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.gsearch{display:none}}
@media (max-width:700px){
  .grid{grid-template-columns:1fr}
  .header,.content{padding-left:16px;padding-right:16px}
  .profile div:not(.avatar-sm){display:none}
  .select,.select.sort{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function () {
  var PER_PAGE = 6, TOTAL = 1248;

  /* ---------- Sample data (replace with your API/database) ---------- */
  var first = ['Juan','Maria','John','Anna','Mark','Lea','Paolo','Katrina','Miguel','Sofia','Carlo','Angela','Rafael','Bianca','Jose','Camille','Daniel','Patricia','Ramon','Isabel','Noel','Trisha','Vicente','Grace','Andres','Hazel','Luis','Nicole','Joel','Erika'];
  var last = ['Dela Cruz','Santos','Carlo','Cruz','Reyes','Ramos','Garcia','Mendoza','Bautista','Aquino','Villanueva','Torres','Flores','Castillo','Navarro','Domingo','Gonzales','Salazar','Pascual','Lopez','Rivera','Soriano','Valdez','Tolentino','Manalo'];
  var seed = 7;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function phone() {
    var d = function (n) { var s = ''; while (n--) s += Math.floor(rnd() * 10); return s; };
    return '09' + d(2) + ' ' + d(3) + ' ' + d(4);
  }
  function pad(n) { return ('000000' + n).slice(-6); }

  var customers = [
    ['Juan Dela Cruz',124,'0977 123 4567','2024-10-05',8,1],
    ['Maria Santos',125,'0918 765 4321','2024-10-08',10,1],
    ['John Carlo',126,'0906 234 5678','2024-10-12',6,1],
    ['Anna Cruz',127,'0927 890 1234','2024-10-15',3,1],
    ['Mark Reyes',128,'0917 654 3210','2024-10-18',9,0],
    ['Lea Ramos',129,'0998 234 5678','2024-10-20',5,1]
  ].map(function (r) {
    return { name: r[0], id: 'CJ-' + pad(r[1]), phone: r[2], date: new Date(r[3] + 'T00:00:00'), stamps: r[4], active: !!r[5] };
  });

  var start = new Date('2022-01-03T00:00:00').getTime();
  var span = (new Date('2024-10-04T00:00:00').getTime() - start) / 86400000;
  for (var n = 1; customers.length < TOTAL; n++) {
    if (n >= 124 && n <= 129) continue;
    customers.push({
      name: pick(first) + ' ' + pick(last),
      id: 'CJ-' + pad(n),
      phone: phone(),
      date: new Date(start + Math.floor(rnd() * span) * 86400000),
      stamps: Math.floor(rnd() * 11),
      active: rnd() > 0.15
    });
  }

  /* ---------- State & elements ---------- */
  var state = { q: '', status: 'all', sort: 'newest', page: 1 };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), pagesEl = $('pages');

  var fmt = function (d) { return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }); };
  var num = function (n) { return n.toLocaleString('en-US'); };
  var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var initials = function (name) { var p = name.split(' '); return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase(); };

  function filtered() {
    var q = state.q.trim().toLowerCase();
    var qDigits = q.replace(/\D/g, '');
    var list = customers.filter(function (c) {
      if (state.status === 'active' && !c.active) return false;
      if (state.status === 'inactive' && c.active) return false;
      if (!q) return true;
      return c.name.toLowerCase().indexOf(q) > -1 ||
             c.id.toLowerCase().indexOf(q) > -1 ||
             (qDigits && c.phone.replace(/\D/g, '').indexOf(qDigits) > -1);
    });
    var s = state.sort;
    list.sort(function (a, b) {
      if (s === 'newest') return b.date - a.date || a.id.localeCompare(b.id);
      if (s === 'oldest') return a.date - b.date || a.id.localeCompare(b.id);
      if (s === 'az') return a.name.localeCompare(b.name);
      return b.name.localeCompare(a.name);
    });
    return list;
  }

  function cardHTML(c) {
    return '<article class="card">' +
      '<div class="card-top"><div class="initials">' + initials(c.name) + '</div><div>' +
        '<h2 class="cname">' + esc(c.name) + '</h2>' +
        '<p class="cid">Loyalty ID: ' + c.id + '</p>' +
        '<span class="pill ' + (c.active ? 'active' : 'inactive') + '">' + (c.active ? 'Active' : 'Inactive') + '</span>' +
      '</div></div>' +
      '<div class="meta"><div><small>Contact</small><b>' + c.phone + '</b></div>' +
      '<div><small>Registered</small><b>' + fmt(c.date) + '</b></div></div>' +
      '<div class="stamps"><div class="stamps-row"><span>Stamp progress</span><b>' + c.stamps + ' / 10</b></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="' + c.stamps + '"><i style="width:' + c.stamps * 10 + '%"></i></div>' +
      '<a class="view" href="customer-details.html?id=' + c.id + '">View Details &rsaquo;</a></div>' +
    '</article>';
  }

  function pageList(cur, total) {
    if (total <= 5) return Array.apply(null, Array(total)).map(function (_, i) { return i + 1; });
    if (cur <= 3) return [1, 2, 3, '…', total];
    if (cur >= total - 2) return [1, '…', total - 2, total - 1, total];
    return [1, '…', cur - 1, cur, cur + 1, '…', total];
  }

  function render() {
    var list = filtered();
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (state.page > pages) state.page = pages;
    var from = (state.page - 1) * PER_PAGE;
    var slice = list.slice(from, from + PER_PAGE);

    $('subtitle').textContent = num(total) + ' ' + (total === TOTAL ? 'self-registered customers' : (total === 1 ? 'matching customer' : 'matching customers')) +
      ' \u00b7 Showing ' + slice.length + ' of ' + num(total);
    $('range').textContent = total ? 'Showing ' + num(from + 1) + '\u2013' + num(from + slice.length) + ' of ' + num(total) + ' customers' : 'No customers to show';
    $('statusLabel').textContent = 'Status: ' + { all: 'All', active: 'Active', inactive: 'Inactive' }[state.status];

    if (!total) {
      grid.innerHTML = '<div class="empty"><h3>No customers found</h3><p>Try a different name, loyalty ID, or contact number, or change the filters.</p><button type="button" class="btn" id="reset">Reset filters</button></div>';
      $('reset').onclick = function () {
        state = { q: '', status: 'all', sort: 'newest', page: 1 };
        $('q').value = ''; $('status').value = 'all'; $('sort').value = 'newest';
        render();
      };
    } else {
      grid.innerHTML = slice.map(cardHTML).join('');
    }

    var html = '<button type="button" class="pg" data-p="' + (state.page - 1) + '" aria-label="Previous page"' + (state.page === 1 ? ' disabled' : '') + '>&lsaquo;</button>';
    if (total) {
      pageList(state.page, pages).forEach(function (p) {
        html += p === '…' ? '<span class="dots">…</span>' :
          '<button type="button" class="pg' + (p === state.page ? ' on' : '') + '" data-p="' + p + '"' + (p === state.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
      });
    }
    html += '<button type="button" class="pg" data-p="' + (state.page + 1) + '" aria-label="Next page"' + (state.page >= pages ? ' disabled' : '') + '>&rsaquo;</button>';
    pagesEl.innerHTML = html;
  }

  /* ---------- Events ---------- */
  var timer;
  $('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    var v = e.target.value;
    timer = setTimeout(function () { state.q = v; state.page = 1; render(); }, 150);
  });
  $('status').addEventListener('change', function (e) { state.status = e.target.value; state.page = 1; render(); });
  $('sort').addEventListener('change', function (e) { state.sort = e.target.value; state.page = 1; render(); });
  pagesEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-p]');
    if (!b || b.disabled) return;
    state.page = +b.getAttribute('data-p');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  render();
})();
</script>
</body>
</html>
