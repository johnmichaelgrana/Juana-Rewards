<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c9b2" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#93a88c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#768f70" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="leafGradSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9d6c4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8a9e84" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Main arching stem -->
  <path d="M 330, -10 C 260, 50 180, 110 80, 180 C 40, 210 10, 250 -10, 310" 
        fill="none" stroke="#7e9477" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Leaf Pair 1 (near top right) -->
  <g transform="translate(250, 45) rotate(-35)">
    <!-- Leaf 1A -->
    <path d="M0,0 C-15,-30 -8,-75 22,-95 C 38,-70 30,-30 0,0 Z" 
          fill="url(#leafGrad)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 8,-35 15,-65 22,-95" fill="none" stroke="#5f7559" stroke-width="0.8" opacity="0.7"/>
    <path d="M3,-25 C12,-28 18,-24 22,-20" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M7,-50 C16,-54 22,-48 26,-44" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M2,-20 C-6,-24 -10,-20 -12,-16" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M5,-45 C-3,-49 -7,-44 -9,-40" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
  </g>

  <g transform="translate(240, 55) rotate(55)">
    <!-- Leaf 1B -->
    <path d="M0,0 C-20,-25 -15,-65 15,-85 C 30,-60 25,-25 0,0 Z" 
          fill="url(#leafGradSoft)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 6,-30 11,-58 15,-85" fill="none" stroke="#5f7559" stroke-width="0.7" opacity="0.7"/>
    <path d="M2,-20 C9,-24 15,-20 18,-17" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M5,-42 C12,-46 18,-41 21,-37" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Leaf Pair 2 (mid branch) -->
  <g transform="translate(180, 100) rotate(-45)">
    <!-- Leaf 2A -->
    <path d="M0,0 C-20,-35 -10,-88 28,-110 C 45,-80 35,-35 0,0 Z" 
          fill="url(#leafGrad)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 10,-40 20,-75 28,-110" fill="none" stroke="#5f7559" stroke-width="0.8" opacity="0.7"/>
    <path d="M4,-30 C15,-35 22,-30 27,-25" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M9,-60 C20,-65 27,-59 32,-53" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M3,-25 C-7,-30 -12,-25 -15,-20" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M6,-55 C-4,-60 -9,-54 -11,-48" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
  </g>

  <g transform="translate(165, 115) rotate(48)">
    <!-- Leaf 2B -->
    <path d="M0,0 C-18,-30 -10,-75 20,-95 C 35,-70 28,-30 0,0 Z" 
          fill="url(#leafGradSoft)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 8,-35 15,-65 20,-95" fill="none" stroke="#5f7559" stroke-width="0.7" opacity="0.7"/>
    <path d="M3,-25 C11,-29 17,-25 21,-21" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M7,-52 C15,-56 21,-51 25,-46" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Leaf Pair 3 (lower mid) -->
  <g transform="translate(110, 160) rotate(-55)">
    <!-- Leaf 3A -->
    <path d="M0,0 C-18,-32 -8,-80 24,-100 C 40,-72 32,-32 0,0 Z" 
          fill="url(#leafGrad)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 9,-36 17,-68 24,-100" fill="none" stroke="#5f7559" stroke-width="0.8" opacity="0.7"/>
    <path d="M4,-28 C14,-32 20,-28 25,-23" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
    <path d="M8,-55 C18,-60 25,-54 29,-49" fill="none" stroke="#5f7559" stroke-width="0.5" opacity="0.6"/>
  </g>

  <g transform="translate(95, 175) rotate(40)">
    <!-- Leaf 3B -->
    <path d="M0,0 C-16,-28 -8,-68 18,-86 C 32,-63 25,-27 0,0 Z" 
          fill="url(#leafGradSoft)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 7,-30 13,-58 18,-86" fill="none" stroke="#5f7559" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- Leaf Pair 4 (terminal towards bottom left) -->
  <g transform="translate(45, 230) rotate(-65)">
    <path d="M0,0 C-15,-28 -6,-70 20,-88 C 34,-62 27,-28 0,0 Z" 
          fill="url(#leafGrad)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 8,-30 14,-60 20,-88" fill="none" stroke="#5f7559" stroke-width="0.7" opacity="0.7"/>
  </g>

  <g transform="translate(25, 255) rotate(30)">
    <path d="M0,0 C-14,-24 -7,-60 16,-76 C 28,-55 22,-24 0,0 Z" 
          fill="url(#leafGradSoft)" stroke="#5f7559" stroke-width="0.8"/>
    <path d="M0,0 C 6,-26 11,-52 16,-76" fill="none" stroke="#5f7559" stroke-width="0.7" opacity="0.7"/>
  </g>
</svg>
