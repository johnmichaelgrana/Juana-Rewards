<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Outer double ring -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="#1b4332" stroke-width="1.8" opacity="0.85"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#1b4332" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Delicate botanical coffee sprig at top -->
  <g transform="translate(80, 48)">
    <!-- Stem -->
    <path d="M0,10 C0,3 -2,-4 0,-12" fill="none" stroke="#1b4332" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M-1,2 C-14,2 -22,-6 -20,-16 C-12,-17 -2,-10 -1,-2 Z" fill="#1b4332" opacity="0.9"/>
    <path d="M-1,2 C-7,-4 -12,-9 -17,-13" fill="none" stroke="#faf7ee" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Right Leaf -->
    <path d="M1,2 C14,2 22,-6 20,-16 C12,-17 2,-10 1,-2 Z" fill="#1b4332" opacity="0.9"/>
    <path d="M1,2 C7,-4 12,-9 17,-13" fill="none" stroke="#faf7ee" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Little center bud -->
    <ellipse cx="0" cy="-14" rx="2.5" ry="3.5" fill="#2d6a4f"/>
  </g>

  <!-- Typography -->
  <!-- CAFE -->
  <text x="80" y="86" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="19" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#1b4332" 
        text-anchor="middle">CAFE</text>
  
  <!-- JUANA -->
  <text x="80" y="104" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#1b4332" 
        text-anchor="middle">JUANA</text>
  
  <!-- Divider dots / subtitle -->
  <g transform="translate(80, 115)">
    <circle cx="-28" cy="0" r="1.2" fill="#52796f"/>
    <line x1="-22" y1="0" x2="-6" y2="0" stroke="#52796f" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#1b4332"/>
    <line x1="6" y1="0" x2="22" y2="0" stroke="#52796f" stroke-width="0.8"/>
    <circle cx="28" cy="0" r="1.2" fill="#52796f"/>
  </g>

  <text x="80" y="125" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="6.5" 
        font-weight="600" 
        letter-spacing="2.5" 
        fill="#52796f" 
        text-anchor="middle">COFFEE &amp; REWARDS</text>
</svg>
